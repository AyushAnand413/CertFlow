name: CertFlow CI Pipeline

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

jobs:
  test-and-build:
    name: Test Suite, E2E Demo & Docker Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: certflow
          POSTGRES_PASSWORD: certflow_secret
          POSTGRES_DB: certflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PostgreSQL 16 schema & connectivity
        env:
          DATABASE_URL: postgresql+psycopg2://certflow:certflow_secret@localhost:5432/certflow
        run: |
          python -c "from sqlalchemy import inspect; from app.db.session import engine; from app.db.models import Base; Base.metadata.create_all(bind=engine); tables = inspect(engine).get_table_names(); assert 'jobs' in tables and 'certificates' in tables, f'Missing tables: {tables}'; print('Verified PostgreSQL tables:', tables)"

      - name: Run pytest unit & integration suite
        env:
          DATABASE_URL: postgresql+psycopg2://certflow:certflow_secret@localhost:5432/certflow
        run: |
          python -m pytest tests/ -v

      - name: Run end-to-end CLI demo verification
        env:
          DATABASE_URL: sqlite:///./ci_demo.db
        run: |
          python scripts/demo.py

      - name: Verify production Docker image build
        run: |
          docker build -t certflow:ci .
